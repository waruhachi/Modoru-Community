name: App request
description: Request an app for Modoru to support
title: "[App request]: "
labels: ["app request"]
body:
  - type: input
    id: app_name
    attributes:
      label: App name
      description: The name of the app as it appears on the App Store.
      placeholder: e.g. Perplexity
    validations:
      required: true
  - type: input
    id: appstore_link
    attributes:
      label: App Store link
      placeholder: https://apps.apple.com/app/id123456789
    validations:
      required: true
  - type: input
    id: minimum_ios
    attributes:
      label: Minimum iOS version it requires
      description: The version the App Store lists under Requires, if you know it.
      placeholder: e.g. iOS 18
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 13
    validations:
      required: false
  - type: input
    id: ios_version
    attributes:
      label: iOS version
      placeholder: e.g. 16.3.1
    validations:
      required: false
  - type: input
    id: jailbreak
    attributes:
      label: Jailbreak
      placeholder: e.g. RootHide, Dopamine
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: What breaks, error messages, or anything else worth knowing.
    validations:
      required: false
